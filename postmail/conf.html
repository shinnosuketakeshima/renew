    <section class="sub-hero" aria-labelledby="postmail-h1">

      </div>
      <div class="layout-container sub-hero__row">

        </div>
      </div>
    </section>

    <div class="postmail-content">
      <div class="layout-container">

        <form class="postmail-form" id="postmail-form" action="!mail_cgi!" method="post">
          <input type="hidden" name="mode" value="send">
<!-- cell_begin -->
          <fieldset>
            <legend class="postmail-label">!key!</legend>
            <p>!val!</p>
          </fieldset>
<!-- cell_end -->

          <div class="postmail-actions">
            <input type="submit" value="送信">
            <a class="postmail-back" href="javascript:history.back()">入力に戻る</a>
          </div>
        </form>

      </div>
    </div>

    <section class="final-cta final-cta--accent" id="final-cta" aria-labelledby="final-cta-heading">

          <span class="final-cta__tel-note">お電話でのご相談</span>
